<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI — Saved Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/product.css?v=4">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body class="dashboard-body accent-amber">
<div class="dashboard-shell">

  <button class="sidebar-backdrop" type="button" data-sidebar-close aria-label="Close navigation"></button>

  <!-- ── Sidebar ── -->
  <aside class="dashboard-sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <div class="sidebar-top">
        <a class="brand-lockup" href="/app/dashboard">
          <span class="brand-badge" aria-hidden="true">S</span>
          <div><span>StudyMate AI</span><span class="brand-name-sub">Premium Learner</span></div>
        </a>
        <button class="sidebar-close-btn" type="button" data-sidebar-close aria-label="Close navigation">&times;</button>
      </div>
    </div>
    <div class="sidebar-new-summary">
      <button class="btn-new-summary" onclick="window.location.href='/app/summarizer'" aria-label="Start a new summary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Summary
      </button>
    </div>
    <div class="sidebar-nav-section">
      <nav class="sidebar-nav" aria-label="App navigation">
        <a href="/app/dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
        <a href="/app/summarizer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h10"/></svg>Summarizer</a>
        <a href="/app/explainer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Explainer</a>
        <a href="/app/audio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>Audio</a>
        <a href="/app/quiz"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Quiz</a>
        <a href="/app/slides"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Slides</a>
        <a class="active" href="/app/saved" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved Notes</a>
        <a href="/app/profile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
      </nav>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="profileAvatar" aria-hidden="true">S</div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name" id="profileName">StudyMate User</span>
        <span class="sidebar-user-role">Premium Learner</span>
      </div>
    </div>
  </aside>

  <!-- ── Top Bar ── -->
  <header class="app-topbar">
    <div class="app-topbar-left">
      <button class="btn btn-ghost sidebar-toggle-btn" type="button" data-sidebar-open aria-label="Open navigation" aria-expanded="false">&#9776;</button>
      <span class="app-topbar-title">Saved Notes</span>
    </div>
    <div class="app-topbar-right">
      <span id="authState" class="status-badge" aria-live="polite">Account</span>
      <a class="settings-entry" href="/app/profile" aria-label="Profile settings" title="Profile">&#9881;</a>
      <button id="logoutBtn" class="btn btn-ghost" style="display:none;">Logout</button>
    </div>
  </header>

  <!-- ── Main: Tabbed Library ── -->
  <main class="dashboard-main" aria-label="Saved sessions library">

    <div class="page-header">
      <h1>Saved Sessions</h1>
    </div>

    <!-- Filter Tab Bar -->
    <div class="tab-bar" role="tablist" aria-label="Filter sessions by type">
      <button class="tab-btn active" type="button" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="tab-btn" type="button" data-filter="summary" role="tab" aria-selected="false">Summaries</button>
      <button class="tab-btn" type="button" data-filter="quiz" role="tab" aria-selected="false">Quizzes</button>
      <button class="tab-btn" type="button" data-filter="slides" role="tab" aria-selected="false">Slides</button>
      <button class="tab-btn" type="button" data-filter="explanation" role="tab" aria-selected="false">Explanations</button>
    </div>

    <!--
      Session card structure — rendered by dashboard.js into #savedGrid:

      <article class="saved-note-card" data-type="summary">
        <span class="status-badge">Summary</span>
        <h4>Note Title</h4>
        <p class="small-feedback">Date</p>
        <p class="panel-copy">Preview text...</p>
        <div class="card-hover-action">
          <a class="btn btn-primary" href="/app/summarizer">View Session</a>
        </div>
      </article>
    -->

    <!-- Session Cards Grid (populated by dashboard.js) -->
    <div id="savedGrid" class="saved-grid" aria-live="polite" aria-label="Saved session cards"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-copy" style="display:none;" aria-live="polite">No saved sessions yet.</div>

  </main>

  <input type="hidden" id="noteTitle" value="">
  <div id="feedback" class="global-feedback" style="display:none;" role="status" aria-live="polite"></div>
  <div id="spinner" class="global-spinner" style="display:none;" role="status" aria-live="polite" aria-label="Loading">
    <div class="spinner-ring" aria-hidden="true"></div>
    <div id="spinnerStatus" class="spinner-status">Loading sessions…</div>
  </div>

</div>
<script src="/static/dashboard.js"></script>
</body>
</html>
