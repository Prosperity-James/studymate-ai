<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI — Audio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/product.css?v=4">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body class="dashboard-body accent-amber">
<div class="dashboard-shell">

  <button class="sidebar-backdrop" type="button" data-sidebar-close aria-label="Close navigation"></button>

  <!-- ── Sidebar ── -->
  <aside class="dashboard-sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <div class="sidebar-top">
        <a class="brand-lockup" href="/app/dashboard">
          <span class="brand-badge" aria-hidden="true">S</span>
          <div><span>StudyMate AI</span><span class="brand-name-sub">Premium Learner</span></div>
        </a>
        <button class="sidebar-close-btn" type="button" data-sidebar-close aria-label="Close navigation">&times;</button>
      </div>
    </div>
    <div class="sidebar-new-summary">
      <button class="btn-new-summary" onclick="window.location.href='/app/summarizer'" aria-label="Start a new summary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Summary
      </button>
    </div>
    <div class="sidebar-nav-section">
      <nav class="sidebar-nav" aria-label="App navigation">
        <a href="/app/dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/app/summarizer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h10"/></svg>
          Summarizer
        </a>
        <a href="/app/explainer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Explainer
        </a>
        <a class="active" href="/app/audio" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
          Audio
        </a>
        <a href="/app/quiz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Quiz
        </a>
        <a href="/app/slides">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Slides
        </a>
        <a href="/app/saved">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          Saved Notes
        </a>
        <a href="/app/profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="profileAvatar" aria-hidden="true">S</div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name" id="profileName">StudyMate User</span>
        <span class="sidebar-user-role">Premium Learner</span>
      </div>
    </div>
  </aside>

  <!-- ── Top Bar ── -->
  <header class="app-topbar">
    <div class="app-topbar-left">
      <button class="btn btn-ghost sidebar-toggle-btn" type="button" data-sidebar-open aria-label="Open navigation" aria-expanded="false">&#9776;</button>
      <span class="app-topbar-title">Audio</span>
    </div>
    <div class="app-topbar-right">
      <span id="authState" class="status-badge" aria-live="polite">Account</span>
      <a class="settings-entry" href="/app/profile" aria-label="Profile settings" title="Profile">&#9881;</a>
      <button id="logoutBtn" class="btn btn-ghost" style="display:none;">Logout</button>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="dashboard-main" aria-label="Audio player workspace">

    <!-- Panel 1: Input + Controls -->
    <div class="panel-card">
      <div class="panel-head">
        <h2>Listen to Notes</h2>
      </div>

      <input id="fileInput" type="file" accept="*/*" style="display:none;" aria-label="Upload file">

      <textarea id="audioText" class="study-textarea" placeholder="Paste your notes or text you want to listen to…" aria-label="Text to read aloud"></textarea>

      <div class="action-row" style="margin-top:12px;">
        <button class="btn btn-ghost" id="uploadTriggerBtn" type="button" aria-label="Upload a file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload File
        </button>
      </div>

      <div class="audio-controls" style="margin-top:16px;">
        <button id="playAudioBtn" class="btn btn-primary audio-play-btn" type="button" aria-label="Play audio">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Play
        </button>
        <button id="pauseAudioBtn" class="btn btn-ghost" type="button" aria-label="Pause audio">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Pause
        </button>
        <button id="stopAudioBtn" class="btn btn-ghost" type="button" aria-label="Stop audio">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          Stop
        </button>
      </div>

      <div id="audioStatus" class="audio-status" style="display:none;" role="status" aria-live="polite" aria-atomic="true">
        <div class="audio-bars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span>Playing...</span>
      </div>
    </div>

    <!-- Panel 2: Playback Settings -->
    <div class="panel-card">
      <div class="panel-head">
        <h2>Playback Settings</h2>
      </div>
      <div class="audio-settings">
        <div class="settings-field">
          <label for="speedSlider">
            <span>Speed: <strong id="speedReadout">1.0x</strong></span>
          </label>
          <input id="speedSlider" class="form-range" type="range"
                 min="0.5" max="2.0" step="0.1" value="1.0"
                 aria-label="Playback speed" aria-valuemin="0.5" aria-valuemax="2.0" aria-valuenow="1.0">
        </div>
        <div class="settings-field">
          <label for="voiceSelect"><span>Voice</span></label>
          <select id="voiceSelect" class="form-select" aria-label="Select voice"></select>
        </div>
        <div class="settings-field" id="stabilityField">
          <label for="stabilitySlider">
            <span>Stability: <strong id="stabilityReadout">0.5</strong></span>
          </label>
          <input id="stabilitySlider" class="form-range" type="range"
                 min="0" max="1" step="0.05" value="0.5"
                 aria-label="Voice stability" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5">
        </div>
        <div class="settings-field" id="similarityField">
          <label for="similaritySlider">
            <span>Similarity: <strong id="similarityReadout">0.75</strong></span>
          </label>
          <input id="similaritySlider" class="form-range" type="range"
                 min="0" max="1" step="0.05" value="0.75"
                 aria-label="Voice similarity" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.75">
        </div>
        <p id="ttsModeNote" class="settings-note"></p>
      </div>
    </div>

  </main>
  <audio id="elevenAudioPlayer" style="display:none;"></audio>

  <div id="feedback" class="global-feedback" style="display:none;" role="status" aria-live="polite"></div>
  <div id="spinner" class="global-spinner" style="display:none;" role="status" aria-live="polite" aria-label="Loading">
    <div class="spinner-ring" aria-hidden="true"></div>
    <div id="spinnerStatus" class="spinner-status">Loading…</div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmB4HbHMHPipGajfAK5gF9yJC5LA" crossorigin="anonymous"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
